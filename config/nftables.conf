table inet egress {

    set blocked_ipv4 {
        type ipv4_addr
        flags interval
    }

    set blocked_ipv6 {
        type ipv6_addr
        flags interval
    }

    chain output {
        type filter hook output priority 0;
        policy accept;

        ip  daddr @blocked_ipv4 reject
        ip6 daddr @blocked_ipv6 reject
    }
}